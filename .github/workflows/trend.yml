name: 트렌드 — trend-scout

on:
  # ⚠️ 발행 체인 시작점(trend→content→post). 이거 꺼져 있으면 발행 전면 중단됨(8/5 이후 중단 원인).
  # 껐던 진짜 이유 = org 월간 '지출 한도 초과'(8/10 로그 확인) — 단순 절약 아님.
  # 재활성화하면 발행 살아나지만 org 지출↑ → 한도 재초과 시 개인 Claude 작업까지 막힘. 예산 판단 후 결정.
  # 켜려면 아래 schedule 두 줄 주석 해제:
  # schedule:
  #   - cron: '2 1 * * 1-5'   # 평일 오전 10:02 KST (content→post 체인 트리거)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: claude CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: trend-scout 트렌드 수집 (웹검색 도구만 허용, --dangerously 없음)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          SIGNAL=$(cat data/team_signal.json 2>/dev/null || echo '{}')
          claude -p "$(cat prompts/trend_scout.txt) === 참고 team_signal: $SIGNAL === [실행 규칙] 위 지침대로 오늘 AI/이커머스/자동화 트렌드를 WebSearch/WebFetch로 실제 검색해서 data/today_trend.json 파일에 저장(덮어쓰기)한다. 기존 구조 유지: {date, signal_applied, github_hot, big_tech_news, hackernews_highlights, recommended_morning, recommended_evening, metadata}. today_trend.json 외 다른 파일은 건드리지 말 것." --allowedTools WebSearch WebFetch Write Read Bash

      - name: today_trend 커밋백
        run: |
          git config user.name "trend-bot"
          git config user.email "bot@sebsonthebeach"
          git add data/today_trend.json
          git diff --staged --quiet || git commit -m "trend: $(date +'%Y-%m-%d')"
          git push
