name: 글생성 — viral-writer

on:
  workflow_run:
    workflows: ["트렌드 — trend-scout"]   # trend 완료 후 자동 트리거 (시각 의존 X)
    types: [completed]
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 실행 슬롯'
        type: choice
        default: morning
        options: [morning, evening]

permissions:
  contents: write

jobs:
  write:
    # 수동이거나 trend가 성공으로 끝났을 때만 (trend 실패 시 옛 트렌드로 헛글 방지)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: claude CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: viral-writer 글 생성 (claude=JSON텍스트만, 저장은 add_post.py)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          # 하루 1개 체제: schedule이면 항상 morning, 수동이면 입력값
          SLOT="${{ github.event.inputs.slot }}"
          [ -z "$SLOT" ] && SLOT=morning
          echo "슬롯: $SLOT"
          SIGNAL=$(cat data/team_signal.json 2>/dev/null || echo '{}')
          TREND=$(python3 -c "import json; d=json.load(open('data/today_trend.json')); print(json.dumps({k:d.get(k) for k in ['signal_applied','recommended_morning','recommended_evening']}, ensure_ascii=False))" 2>/dev/null || echo '{}')
          claude -p "$(cat prompts/viral_writer.txt) === 참고용 team_signal(파일 읽지 말 것): $SIGNAL === 오늘 트렌드 소재(trend-scout가 웹검색으로 수집, $SLOT 슬롯 추천 참고): $TREND === [출력 규칙·중요] 위 작성 원칙과 오늘 트렌드를 살려 오늘 $SLOT 슬롯 글 1개만 만든다. 파일을 직접 수정하지 말고, 아래 형식 그대로만 출력한다 (본문 안에 따옴표 써도 됨, 구분선은 정확히 그대로):
          ===CONTENT===
          (본문 150-300자)
          ===REPLY===
          (첫 댓글, 없으면 비워둠)
          ===TOPIC===
          (AI_THREADS 또는 BUSINESS_ENTREPENEURSHIP 또는 PERSONAL_FINANCE 또는 CAREERS_JOBS 중 하나)
          ===END===" > /tmp/gen_post.txt
          echo "--- 1차 생성 ---"; cat /tmp/gen_post.txt; echo
          # quality-critic 팀원 검수 — 짜침/AI티/지표부정확/broadcast면 FAIL
          VERDICT=$(claude -p "$(cat prompts/quality_critic.txt) === 검수할 글 시작 === $(cat /tmp/gen_post.txt) === 검수할 글 끝 ===")
          echo "--- 검수 결과: $VERDICT ---"
          if echo "$VERDICT" | grep -qi "FAIL"; then
            echo "반려 → 피드백 반영해 1회 재생성"
            claude -p "$(cat prompts/viral_writer.txt) === team_signal: $SIGNAL === 트렌드: $TREND === [직전 글이 이 이유로 반려됨, 반드시 고쳐서 다시 써라]: $VERDICT === 출력은 ===CONTENT=== ===REPLY=== ===TOPIC=== ===END=== 형식만, $SLOT 슬롯 글 1개." > /tmp/gen_post.txt
            echo "--- 재생성 ---"; cat /tmp/gen_post.txt; echo
          fi
          python3 add_post.py --slot "$SLOT" --infile /tmp/gen_post.txt

      - name: fact_checker 검증 (틀린 정보·과장 있으면 blocked → 발행 스킵)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python3 fact_checker.py || echo "fact_checker 스킵/실패 — 글은 유지하고 진행"

      - name: posts.json 커밋백
        run: |
          git config user.name "viral-bot"
          git config user.email "bot@sebsonthebeach"
          git add data/posts.json
          git diff --staged --quiet || git commit -m "content: viral-writer $(date +'%Y-%m-%d')"
          git push
