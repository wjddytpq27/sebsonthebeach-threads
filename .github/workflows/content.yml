name: 글생성 — viral-writer

on:
  schedule:
    - cron: '12 1 * * *'     # 오전 10:12 KST (발행 10:35 직전)
    - cron: '40 10 * * *'    # 저녁 19:40 KST (발행 20:00 직전)
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 실행 슬롯'
        type: choice
        default: morning
        options: [morning, evening]

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: claude CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: viral-writer 글 생성 (슬롯 1개, 발행 직전)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "40 10 * * *" ]; then
            SLOT=evening
          elif [ "${{ github.event.schedule }}" = "12 1 * * *" ]; then
            SLOT=morning
          else
            SLOT="${{ github.event.inputs.slot }}"
          fi
          if [ "$SLOT" = "evening" ]; then
            HINT="오늘 저녁 글 1개만 작성 (evening:true 필드 포함)"
          else
            HINT="오늘 오전 글 1개만 작성 (evening 필드 없이)"
          fi
          echo "슬롯: $SLOT"
          claude -p "$(cat prompts/viral_writer.txt) [클라우드 just-in-time 자동실행] 지금이 발행 직전이다. $HINT 해서 data/posts.json에 추가해. 며칠치 미리 쓰지 말고 오늘 이 슬롯 1개만." --agent viral-writer --dangerously-skip-permissions

      - name: posts.json 커밋백
        run: |
          git config user.name "viral-bot"
          git config user.email "bot@sebsonthebeach"
          git add data/posts.json
          git diff --staged --quiet || git commit -m "content: viral-writer $(date +'%Y-%m-%d')"
          git push
