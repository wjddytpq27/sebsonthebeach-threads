name: 글생성 — viral-writer

on:
  schedule:
    - cron: '12 1 * * *'     # 오전 10:12 KST (발행 10:35 직전)
    - cron: '40 10 * * *'    # 저녁 19:40 KST (발행 20:00 직전)
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 실행 슬롯'
        type: choice
        default: morning
        options: [morning, evening]

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: claude CLI 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: viral-writer 글 생성 (claude=JSON텍스트만, 저장은 add_post.py)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ "${{ github.event.schedule }}" = "40 10 * * *" ]; then
            SLOT=evening
          elif [ "${{ github.event.schedule }}" = "12 1 * * *" ]; then
            SLOT=morning
          else
            SLOT="${{ github.event.inputs.slot }}"
          fi
          echo "슬롯: $SLOT"
          SIGNAL=$(cat data/team_signal.json 2>/dev/null || echo '{}')
          claude -p "$(cat prompts/viral_writer.txt) === 참고용 team_signal(이미 내용 줬으니 파일 읽지 말 것): $SIGNAL === [출력 규칙·중요] 위 작성 원칙대로 오늘 $SLOT 슬롯 글 1개만 만든다. 파일을 직접 수정하지 말고, 아래 형식 그대로만 출력한다 (본문 안에 따옴표 써도 됨, 구분선은 정확히 그대로):
          ===CONTENT===
          (본문 150-300자)
          ===REPLY===
          (첫 댓글, 없으면 비워둠)
          ===TOPIC===
          (AI_THREADS 또는 BUSINESS_ENTREPENEURSHIP 또는 PERSONAL_FINANCE 또는 CAREERS_JOBS 중 하나)
          ===END===" > /tmp/gen_post.txt
          echo "--- claude 출력 ---"; cat /tmp/gen_post.txt; echo
          python3 add_post.py --slot "$SLOT" --infile /tmp/gen_post.txt

      - name: posts.json 커밋백
        run: |
          git config user.name "viral-bot"
          git config user.email "bot@sebsonthebeach"
          git add data/posts.json
          git diff --staged --quiet || git commit -m "content: viral-writer $(date +'%Y-%m-%d')"
          git push
