name: 매일 참여 브리프 발송

on:
  # 자동 비활성화 — hunter-engager가 cron으로 자동 실행되므로 수동 브리프 불필요
  # schedule:
  #   - cron: '30 23 * * *'   # 매일 08:30 KST
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 참여 브리프 Slack 발송
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python engagement_brief.py
