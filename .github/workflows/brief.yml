name: 매일 참여 브리프 발송

on:
  schedule:
    - cron: '30 23 * * *'   # 매일 08:30 KST (UTC 전날 23:30)
  workflow_dispatch:

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 참여 브리프 Slack 발송
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python engagement_brief.py
