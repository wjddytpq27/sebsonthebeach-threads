name: 분석 — follow_attributor + growth_analyst

on:
  # schedule 비활성화 (토큰 절약 — 수동 실행만 유지)
  # schedule:
  #   - cron: '45 13 * * *'    # 22:45 KST (track 22:00 데이터 커밋백 후)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: claude CLI 설치 (growth_analyst가 sonnet 분석에 사용)
        run: npm install -g @anthropic-ai/claude-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: follow_attributor (팔로워 ↔ 글 연결)
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python follow_attributor.py

      - name: growth_analyst (team_signal 생성)
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python growth_analyst.py

      - name: 분석 산출물 커밋백 (team_signal 등)
        run: |
          git config user.name "analyst-bot"
          git config user.email "bot@sebsonthebeach"
          git add data/team_signal.json data/growth_strategy.json data/follow_attribution.json
          git diff --staged --quiet || git commit -m "signal: $(date +'%Y-%m-%d') 분석"
          git push
