name: 포스팅 — Threads (오전/저녁)

on:
  schedule:
    - cron: '35 1 * * 1-5'  # 평일 오전 10:35 KST (하루 1개)
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 실행 슬롯'
        type: choice
        default: morning
        options: [morning, evening]

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 포스팅 실행 (슬롯 자동 판별)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          # schedule 트리거면 cron 시각으로 슬롯 결정, 수동이면 입력값 사용
          # 하루 1개 체제: schedule이면 항상 morning, 수동이면 입력값
          SLOT="${{ github.event.inputs.slot }}"
          [ -z "$SLOT" ] && SLOT=morning
          echo "슬롯: $SLOT"
          python post_threads.py --slot "$SLOT"
