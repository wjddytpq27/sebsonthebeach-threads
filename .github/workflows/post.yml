name: 포스팅 — Threads (평일 오전)

on:
  schedule:
    - cron: '35 1 * * 1-5'  # 평일 오전 10:35 KST (하루 1개)
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 실행 슬롯'
        type: choice
        default: morning
        options: [morning, evening]

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # 카드 생성 (runner 사전설치 google-chrome) — 실패해도 텍스트로 발행
      - name: 카드 생성
        id: card
        continue-on-error: true
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          [ -z "$SLOT" ] && SLOT=morning
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"
          python3 make_card.py --slot "$SLOT" --out /tmp/card.png

      # cards public 레포에 업로드(PAT) → raw URL 확보
      - name: 카드 업로드 (cards 레포)
        id: upload
        if: steps.card.outcome == 'success'
        continue-on-error: true
        run: |
          DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          FNAME="card_${DATE}_${{ steps.card.outputs.slot }}.png"
          git clone --depth 1 "https://x-access-token:${{ secrets.CARDS_PAT }}@github.com/wjddytpq27/sebsonthebeach-cards.git" /tmp/cards
          cp /tmp/card.png "/tmp/cards/$FNAME"
          cd /tmp/cards
          git config user.name "card-bot"
          git config user.email "bot@sebsonthebeach"
          git add "$FNAME"
          git commit -m "card $DATE"
          git push
          echo "url=https://raw.githubusercontent.com/wjddytpq27/sebsonthebeach-cards/main/$FNAME" >> "$GITHUB_OUTPUT"

      # 발행 — 이미지 URL 있으면 첨부, 없으면(카드/업로드 실패) 텍스트
      - name: 발행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SLOT="${{ steps.card.outputs.slot }}"
          [ -z "$SLOT" ] && SLOT=morning
          sleep 5   # raw URL 전파 대기
          python3 post_threads.py --slot "$SLOT" --image "${{ steps.upload.outputs.url }}"
