name: 포스팅 — Threads (평일 오전)

on:
  workflow_run:
    workflows: ["글생성 — viral-writer"]   # 글 생성/검수 완료 후 자동 발행 (시각 의존 X)
    types: [completed]
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 실행 슬롯'
        type: choice
        default: morning
        options: [morning, evening]

permissions:
  contents: read

jobs:
  post:
    # 수동이거나 글생성이 성공으로 끝났을 때만
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      # 발행 — 네이티브 텍스트. (카드 이미지 폐기: Threads는 텍스트 우선, 그라디언트 카드는
      #  검색 유입 죽이고 봇티 남 → 2026-07-13 제거)
      - name: 발행
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          SLOT="${{ github.event.inputs.slot }}"
          [ -z "$SLOT" ] && SLOT=morning
          python3 post_threads.py --slot "$SLOT"
