name: 포스팅 — Threads (오전/저녁)

on:
  schedule:
    - cron: '35 1 * * *'    # 오전 10:35 KST (UTC 01:35)
    - cron: '0 11 * * *'    # 저녁 20:00 KST (UTC 11:00)
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 실행 슬롯'
        type: choice
        default: morning
        options: [morning, evening]

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 포스팅 실행 (슬롯 자동 판별)
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          # schedule 트리거면 cron 시각으로 슬롯 결정, 수동이면 입력값 사용
          if [ "${{ github.event.schedule }}" = "0 11 * * *" ]; then
            SLOT=evening
          elif [ "${{ github.event.schedule }}" = "35 1 * * *" ]; then
            SLOT=morning
          else
            SLOT="${{ github.event.inputs.slot }}"
          fi
          echo "슬롯: $SLOT"
          python post_threads.py --slot "$SLOT"
