name: 소나 — Daily Track

on:
  # 비활성화 — 로컬 track.py (launchd 22:00)로 대체됨
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 팔로워 + 인사이트 수집
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python track.py

      - name: 데이터 커밋
        run: |
          git config user.name "소나-bot"
          git config user.email "bot@sebsonthebeach"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(date +'%Y-%m-%d') 일간 수집"
          git push
