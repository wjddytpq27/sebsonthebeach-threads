name: 전략 — strategist (주간)

on:
  schedule:
    - cron: '0 15 * * 0'    # 월요일 00:00 KST (UTC 일요일 15:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: claude CLI 설치 (strategist가 opus 분석에 사용)
        run: npm install -g @anthropic-ai/claude-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: strategist 주간 전략 리뷰 + 프롬프트 튜닝
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python strategist.py || echo "strategist 스킵/실패 — 기존 프롬프트 유지"

      - name: 전략·프롬프트 커밋백
        run: |
          git config user.name "strategist-bot"
          git config user.email "bot@sebsonthebeach"
          git add prompts/ data/strategic_review.json data/team_signal.json data/growth_strategy.json
          git diff --staged --quiet || git commit -m "strategy: $(date +'%Y-%m-%d') 주간 리뷰"
          git push
